<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Daruma N3</title>
<style>
:root{--bg:#eef1f7;--card:#ffffff;--ink:#141a33;--ink2:#3a4263;--muted:#5f6889;--line:#d9deeb;--pri:#2c3fb0;--pri-ink:#ffffff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1120;--card:#161b31;--ink:#eef1fb;--ink2:#c9cfe3;--muted:#98a1c0;--line:#2a3150;--pri:#7d8cff;--pri-ink:#0d1120;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px 24px;display:grid;gap:14px;justify-items:start}
svg{width:64px;height:64px}
h1{margin:0;font-size:20px;line-height:1.3;text-wrap:balance}
p{margin:0;color:var(--ink2)}
.small{font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;background:var(--pri);color:var(--pri-ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
#st{min-height:1.4em}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#171b34"/><svg viewBox="0 0 64 64" x="64" y="64" width="384" height="384"><path d="M32 4C16 4 6 16.5 6 33c0 16 10.5 27 26 27s26-11 26-27C58 16.5 48 4 32 4z" fill="#d3311f"/><path d="M32 60c-9.4 0-17-3.9-21.6-10.4C16.6 53.6 24 55.6 32 55.6s15.4-2 21.6-6C49 56.1 41.4 60 32 60z" fill="#000" opacity=".18"/><path d="M32 12.5c-11.2 0-19 6.7-19 16S20.8 43.5 32 43.5s19-5.7 19-15-7.8-16-19-16z" fill="#f6e3c5"/><path d="M16 20.2c3.2-3.4 8.4-4 12-1.3M48 20.2c-3.2-3.4-8.4-4-12-1.3" fill="none" stroke="#1d1a22" stroke-width="2.5" stroke-linecap="round"/><circle cx="23.5" cy="27" r="6.4" fill="#fffaf0" stroke="#1d1a22" stroke-width="1.3"/><circle cx="40.5" cy="27" r="6.4" fill="#fffaf0" stroke="#1d1a22" stroke-width="1.3"/><circle cx="40.5" cy="27.4" r="3.6" fill="#1d1a22"/><path d="M32 30v4M27.2 38c3.2 1.7 6.4 1.7 9.6 0M17.5 33.5c2.4 2.3 5 3 7.6 2.5M46.5 33.5c-2.4 2.3-5 3-7.6 2.5" fill="none" stroke="#1d1a22" stroke-width="1.7" stroke-linecap="round"/><path d="M21 48.5c3.4-2.2 7-3.3 11-3.3s7.6 1.1 11 3.3M27 51.5v4.5M32 50.5v6M37 51.5v4.5" fill="none" stroke="#f0c04a" stroke-width="2" stroke-linecap="round"/></svg></svg>
  <h1>Chưa kết nối được tới Daruma N3</h1>
  <p>Lần mở đầu tiên cần có mạng để tải bài học. Từ lần sau, Daruma N3 mở được cả khi không có mạng.</p>
  <button id="go" type="button">Thử lại</button>
  <p class="small" id="st" role="status">Ứng dụng sẽ tự thử lại khi máy có mạng.</p>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search), target = q.get('u') || 'https://tranhuutai1803-cloud.github.io/?app=1';
  const st = document.getElementById('st');
  const go = () => { st.textContent = 'Đang kết nối…'; location.replace(target); };
  document.getElementById('go').addEventListener('click', go);
  addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 20000);
})();
</script>
</body>
</html>
